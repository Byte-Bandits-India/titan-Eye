name: 🚀 Build & Deploy Titan to Linux EC2 Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗 Set Build Environment Variables for Vite
        run: |
          echo "VITE_API_BASE_URL=/api" > .env.production
          echo "VITE_E2EE_SECRET=${{ secrets.VITE_E2EE_SECRET }}" >> .env.production

      - name: 🏗 Build App (Frontend & Backend)
        run: npm run build

      - name: 📦 Create Deployment Package
        run: |
          tar -czf deploy.tar.gz \
            dist \
            dist-server \
            server.js \
            package.json \
            package-lock.json

      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 📤 Upload to Linux EC2 (SCP)
        env:
          HOST: ${{ secrets.EC2_HOST || secrets.SERVER_IP }}
          USER: ${{ secrets.EC2_USER || secrets.USERNAME || 'ec2-user' }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          echo "Uploading deployment package to $USER@$HOST..."
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ServerAliveInterval=15 -P $PORT -i ~/.ssh/id_rsa deploy.tar.gz $USER@$HOST:/home/$USER/deploy.tar.gz

      - name: 🚀 Deploy on Linux EC2 Server (SSH)
        env:
          HOST: ${{ secrets.EC2_HOST || secrets.SERVER_IP }}
          USER: ${{ secrets.EC2_USER || secrets.USERNAME || 'ec2-user' }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -p $PORT -i ~/.ssh/id_rsa $USER@$HOST bash -s << 'EOF'
            set -e
            echo "🚀 Starting Linux EC2 Deployment..."

            APP_DIR="/home/$(whoami)/titan"
            TEMP_ARCHIVE="/home/$(whoami)/deploy.tar.gz"

            echo "📁 Ensuring required application directories exist..."
            mkdir -p "$APP_DIR"
            mkdir -p "$APP_DIR/uploads"
            mkdir -p "$APP_DIR/logs"

            # 1. Clean old build directories (dist and dist-server)
            echo "🧹 Cleaning old build directories..."
            rm -rf "$APP_DIR/dist" "$APP_DIR/dist-server"

            # 2. Extract new build package into app directory (preserves .env, database.db, and uploads)
            echo "📦 Extracting new build package..."
            tar -xzf "$TEMP_ARCHIVE" -C "$APP_DIR"
            rm -f "$TEMP_ARCHIVE"

            # 3. Enter application directory
            cd "$APP_DIR"

            # 4. Install production dependencies and compile native binaries for Linux
            echo "📦 Installing production dependencies..."
            npm install --omit=dev --legacy-peer-deps

            # 5. Ensure PM2 / Node binary is discoverable across different shell environments
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(node -v 2>/dev/null || echo "")/bin

            # 6. Restart backend process using PM2
            echo "🔄 Restarting application with PM2..."
            if command -v pm2 &> /dev/null; then
              if pm2 describe titan &> /dev/null; then
                pm2 reload titan || pm2 restart titan
              else
                pm2 start server.js --name titan --time
                pm2 save
              fi
            else
              echo "⚠️ PM2 not found in PATH. Checking if running on port 3001..."
              fuser -k 3001/tcp || true
              nohup node server.js > logs/app.log 2>&1 &
            fi

            # 7. Health Check Verification
            echo "🔍 Verifying application health..."
            sleep 4
            if command -v curl &> /dev/null; then
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/ping || true)
              echo "Health check response code: $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check passed: Server is running on port 3001!"
              else
                echo "ℹ️ Health check response: $HTTP_CODE"
              fi
            fi

            echo "✅ Titan deployment to Linux EC2 completed successfully!"
          EOF
