name: 🚀 Build & Deploy Titan to Windows IIS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗 Set Build Environment Variables for Vite
        run: |
          echo "VITE_API_BASE_URL=/api" > .env.production
          echo "VITE_E2EE_SECRET=${{ secrets.VITE_E2EE_SECRET }}" >> .env.production

      - name: 🏗 Build App
        run: npm run build

      - name: 📄 Copy web.config into dist
        run: |
          cp web.config dist/web.config

      - name: 📦 Create Deployment Package
        run: |
          tar -czf deploy.tar.gz \
            dist \
            dist-server \
            server.js \
            web.config \
            package.json \
            package-lock.json

      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 📤 Upload to Windows Server (SCP)
        run: |
          scp -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa deploy.tar.gz ${{ secrets.USERNAME || 'Administrator' }}@${{ secrets.SERVER_IP }}:C:/Windows/Temp/deploy.tar.gz

      - name: 🚀 Deploy on Windows IIS Server (SSH & PowerShell)
        run: |
          ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa ${{ secrets.USERNAME || 'Administrator' }}@${{ secrets.SERVER_IP }} powershell -ExecutionPolicy Bypass -NoProfile -Command - << 'EOF'
            $ErrorActionPreference = "Continue"
            Write-Host "🚀 Starting Windows IIS Deployment..."

            $APP_DIR = "C:\titan"
            $DATA_DIR = "C:\titan\data"
            $DIST_DIR = "C:\titan\dist"
            $DIST_SERVER_DIR = "C:\titan\dist-server"
            $NSSM = "C:\Windows\system32\nssm.exe"

            # 1. Stop backend service
            Write-Host "⏸️  Stopping TitanService..."
            if (Test-Path $NSSM) {
              & $NSSM stop TitanService
            } else {
              Get-Service TitanService -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
            }

            Start-Sleep -Seconds 3

            # 2. Terminate any lingering Node.js process on port 3001 to release file locks & port
            Write-Host "🛑 Checking for lingering backend processes on port 3001..."
            try {
              $portConns = Get-NetTCPConnection -LocalPort 3001 -ErrorAction SilentlyContinue
              if ($portConns) {
                $pids = $portConns | Select-Object -ExpandProperty OwningProcess -Unique
                foreach ($procId in $pids) {
                  if ($procId -gt 0) {
                    Write-Host "Terminating lingering process on port 3001 (PID: $procId)..."
                    Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue
                  }
                }
              }
            } catch {
              Write-Host "Port check completed."
            }

            # 3. Ensure directories exist
            if (!(Test-Path $APP_DIR)) { New-Item -ItemType Directory -Force -Path $APP_DIR | Out-Null }
            if (!(Test-Path $DATA_DIR)) { New-Item -ItemType Directory -Force -Path $DATA_DIR | Out-Null }
            if (!(Test-Path "$DATA_DIR\backups")) { New-Item -ItemType Directory -Force -Path "$DATA_DIR\backups" | Out-Null }

            # 4. Preserve database
            if ((Test-Path "$APP_DIR\database.db") -and !(Test-Path "$DATA_DIR\database.db")) {
              Write-Host "📦 Preserving database in data directory..."
              Copy-Item -Path "$APP_DIR\database.db*" -Destination $DATA_DIR -Force
            }

            # 5. Clean out previous build directories (prevents stale code / deleted files from persisting)
            Write-Host "🧹 Cleaning old build directories ($DIST_DIR and $DIST_SERVER_DIR)..."
            if (Test-Path $DIST_DIR) {
              Remove-Item -Recurse -Force $DIST_DIR -ErrorAction SilentlyContinue
            }
            if (Test-Path $DIST_SERVER_DIR) {
              Remove-Item -Recurse -Force $DIST_SERVER_DIR -ErrorAction SilentlyContinue
            }

            # 6. Extract new build package
            Write-Host "📦 Extracting new build to $APP_DIR ..."
            tar -xzf "C:\Windows\Temp\deploy.tar.gz" -C $APP_DIR
            Remove-Item -Force "C:\Windows\Temp\deploy.tar.gz" -ErrorAction SilentlyContinue

            # 7. Ensure web.config is inside dist directory for IIS
            if (Test-Path "$APP_DIR\web.config") {
              Copy-Item -Path "$APP_DIR\web.config" -Destination $DIST_DIR -Force
            }

            Set-Location $APP_DIR

            # 8. Install production dependencies
            Write-Host "📦 Installing production dependencies..."
            npm install --omit=dev --legacy-peer-deps

            # 9. Start backend service
            Write-Host "▶️  Starting TitanService..."
            if (Test-Path $NSSM) {
              & $NSSM start TitanService
            } else {
              Get-Service TitanService -ErrorAction SilentlyContinue | Start-Service
            }

            # 10. Recycle IIS Application Pools & ensure ARR preserves external redirect locations
            Write-Host "🔄 Recycling IIS Application Pools..."
            $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
            if (Test-Path $appcmd) {
              try {
                & $appcmd set config -section:system.webServer/proxy /reverseRewriteHostInResponseHeaders:"False" /commit:apphost
              } catch {
                Write-Host "ARR proxy configuration check finished."
              }
              try {
                & $appcmd list apppools /text:name | ForEach-Object {
                  Write-Host "Recycling AppPool: $_"
                  & $appcmd recycle apppool /apppool.name:$_
                }
              } catch {
                Write-Host "Apppool recycle check finished."
              }
            }

            # 11. Verify TitanService status
            Start-Sleep -Seconds 3
            Write-Host "🔍 TitanService status:"
            Get-Service TitanService | Select-Object Name, DisplayName, State

            Write-Host "✅ Windows IIS deployment completed successfully!"
          EOF
