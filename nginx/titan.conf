# Titan Nginx Configuration for titan-dev.thebytebandits.com
# Location on EC2: /etc/nginx/conf.d/titan.conf

# 1. HTTPS Server Block (Port 443)
server {
    listen 443 ssl http2;
    server_name titan-dev.thebytebandits.com;
    server_tokens off;

    # SSL Certificate for titan-dev (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/titan-dev.thebytebandits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titan-dev.thebytebandits.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend Build Directory
    root /home/ec2-user/titan/dist;
    index index.html;

    # Maximum payload size for video/image uploads (1GB)
    client_max_body_size 1G;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # Gzip Compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Frontend SPA Routing (Single Page App)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & HTTP 1.1 Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Server-Sent Events (SSE) & Long Polling Support
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 2. HTTP to HTTPS Redirection (Port 80)
server {
    listen 80;
    server_name titan-dev.thebytebandits.com;

    return 301 https://$host$request_uri;
}
