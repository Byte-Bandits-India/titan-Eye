server {
    listen 443 ssl http2;
    server_name titan-dev.thebytebandits.com;
    server_tokens off;

    # SSL Certificate for titan-dev (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/titan-dev.thebytebandits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titan-dev.thebytebandits.com/privkey.pem;
    # SSL Protocols & Modern ECDHE Ciphers (VAPT Finding 9 Remediation: Disable DHE / D(HE)ater)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Frontend Build Directory
    root /home/ec2-user/titan/dist;
    index index.html;

    # Maximum payload size for video/image uploads (1GB)
    client_max_body_size 1G;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # Gzip Compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # VAPT Finding 13 & 22: Disable TRACE, TRACK, DEBUG, and WebDAV methods (PROPFIND, PROPPATCH, etc.)
    if ($request_method ~ ^(TRACE|TRACK|DEBUG|PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK|SEARCH)$) {
        return 405;
    }

    # VAPT Finding 24: Reject path traversal sequences (encoded and unencoded)
    if ($request_uri ~* "(\.\.[/\\]|\.\.%2[fF]|\.\.%5[cC]|%2[eE]%2[eE]|%252[eE]%252[eE]|%252[fF])") {
        return 400;
    }

    # VAPT Finding 15: Prevent Web Crawlers / Search Engines from indexing (X-Robots-Tag)
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # VAPT Finding 15: Block sitemap requests
    location ~* ^/sitemap.*\.xml$ {
        return 404;
    }

    # VAPT Finding 17: Block direct access to source code, sourcemaps, dotfiles, and config files
    location ~* /\.(?!well-known/) {
        deny all;
        return 404;
    }

    # VAPT Finding 17 & 18: Block direct access to source code, sourcemaps, dotfiles, and legacy scripts (.php, .asp, etc.)
    location ~* \.(ts|tsx|jsx|map|env|git|ps1|sh|db|sqlite|log|md|yml|yaml|php|asp|aspx|jsp|cgi)$ {
        deny all;
        return 404;
    }

    # Frontend SPA Routing (Single Page App) - Restrict methods on static pages (VAPT Finding 13)
    location / {
        limit_except GET HEAD POST {
            deny all;
        }
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001;

        # VAPT Finding 16 & 20: Suppress framework headers and prevent internal IP disclosure in redirects
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_redirect http://127.0.0.1:3001/ /;
        proxy_redirect default;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & HTTP 1.1 Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Server-Sent Events (SSE) & Long Polling Support
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 2. HTTP to HTTPS Redirection (Port 80)
server {
    listen 80;
    server_name titan-dev.thebytebandits.com;
    server_tokens off;

    return 301 https://$host$request_uri;
}
